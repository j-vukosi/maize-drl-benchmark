[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maize-drl-benchmark"
version = "1.0.0"
description = "Reproducible benchmark of PPO, CrossQ, DSAC-T and DreamerV3 for adaptive maize irrigation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "V. J. Maluleke"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8",
  "gymnasium>=0.29.1,<1.3",
  "torch>=2.3,<3",
  "stable-baselines3>=2.7,<3",
  "sb3-contrib>=2.7,<3",
]

[project.optional-dependencies]
dreamer = ["ray[rllib]>=2.48,<2.57", "tensorflow>=2.16,<2.20"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
maize-benchmark = "maize_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
